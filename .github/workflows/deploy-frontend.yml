name: Deploy Frontend to Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod

  # Auto-deploy to staging after Frontend CI succeeds on the development branch.
  # Prod deploys are manual (workflow_dispatch) and gated by the 'prod'
  # GitHub environment protection rules (required reviewers).
  workflow_run:
    workflows: ["Frontend CI"]
    types:
      - completed
    branches:
      - development

concurrency:
  group: deploy-frontend-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22'
  FRONTEND_PATH: 'src/frontend'

jobs:
  build-and-deploy:
    name: Build and Deploy to Azure Static Web App (${{ inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment || 'staging' }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'development')

    steps:
      - name: Set deployment targets
        run: |
          ENV="${{ inputs.environment || 'staging' }}"
          echo "DEPLOY_ENV=$ENV" >> $GITHUB_ENV
          echo "SWA_NAME=myleague-${ENV}-web" >> $GITHUB_ENV
          echo "AZURE_RESOURCE_GROUP=myleague-${ENV}-rg" >> $GITHUB_ENV
          echo "Deploying to: myleague-${ENV}-web (rg: myleague-${ENV}-rg)"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ env.FRONTEND_PATH }}/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Create production environment file
        run: |
          # Use the environment-scoped VITE_API_URL variable if set,
          # otherwise derive it from the naming convention.
          API_URL="${{ vars.VITE_API_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://myleague-${DEPLOY_ENV}-api.azurewebsites.net/api"
          fi
          echo "Using API URL: $API_URL"
          echo "VITE_API_URL=$API_URL" > .env.production
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Build application
        run: pnpm run build
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch Static Web App deployment token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "SWA_DEPLOYMENT_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: ${{ env.FRONTEND_PATH }}/dist
          output_location: '.'
          skip_app_build: true

      # Smoke test: the deployed SPA must load (HTTP 200, contains the React
      # root element) and the SPA fallback must serve index.html for deep links
      - name: Smoke test
        run: |
          HOSTNAME=$(az staticwebapp show \
            --name "$SWA_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "defaultHostname" -o tsv)
          URL="https://${HOSTNAME}"
          echo "Smoke testing $URL"
          FAIL=0

          check_page() {
            local desc="$1" url="$2"
            for i in $(seq 1 5); do
              BODY=$(curl -s --max-time 30 -w "\n%{http_code}" "$url" || echo "000")
              STATUS=$(echo "$BODY" | tail -n 1)
              if [ "$STATUS" = "200" ] && echo "$BODY" | grep -q 'id="root"'; then
                echo "PASS: $desc (HTTP 200, root element present)"
                return
              fi
              echo "Attempt $i for '$desc': HTTP $STATUS - retrying in 10s..."
              sleep 10
            done
            echo "FAIL: $desc ($url)"
            FAIL=1
          }

          check_page "Landing page loads"        "$URL/"
          check_page "SPA fallback on deep link" "$URL/clubs"

          if [ "$FAIL" -ne 0 ]; then
            echo "Frontend smoke tests FAILED"
            exit 1
          fi
          echo "All frontend smoke tests passed"
