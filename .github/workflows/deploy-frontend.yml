name: Deploy Frontend to Azure

on:
  workflow_dispatch:

  workflow_run:
    workflows: ["Frontend CI"]
    types:
      - completed
    branches:
      - development

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  FRONTEND_PATH: 'src/frontend'

jobs:
  build-and-deploy:
    name: Build and Deploy to Azure Static Web App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'development')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Create production environment file
        run: echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > .env.production
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Build application
        run: pnpm run build
        working-directory: ${{ env.FRONTEND_PATH }}

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APP_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: ${{ env.FRONTEND_PATH }}/dist
          output_location: '.'
          skip_app_build: true
