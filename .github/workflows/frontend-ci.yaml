name: Frontend CI

on:
  push:
    branches: [ master, development, jantoi/myl-24-do-ci-for-frontend ]
    paths:
      - 'src/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/frontend-ci.yaml'
  pull_request:
    branches: [ master, development ]
    paths:
      - 'src/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/frontend-ci.yaml'
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  WORKING_DIRECTORY: 'src/frontend'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        
    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
        
    - name: Cache pnpm dependencies
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
          
    - name: Install dependencies
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: pnpm install --frozen-lockfile
      
    - name: Run ESLint
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: pnpm lint
      
    - name: TypeScript type checking
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npx tsc --noEmit
      
    - name: Build production bundle
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: pnpm build
      
    - name: Check build artifacts
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        if [ -d "dist" ]; then
          echo "✅ Build artifacts created successfully"
          echo "📦 Build size:"
          du -sh dist/
          ls -la dist/
        else
          echo "❌ Build artifacts not found"
          exit 1
        fi
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: ${{ env.WORKING_DIRECTORY }}/dist/
        retention-days: 7

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        docker build -t myleague-frontend:test .
        
    - name: Test container startup
      run: |
        # Start container in background
        docker run -d --name myleague-frontend-test -p 5173:5173 myleague-frontend:test
        
        # Wait for startup
        echo "Waiting for frontend to start..."
        sleep 15
        
        # Check if container is running
        if docker ps | grep -q myleague-frontend-test; then
          echo "✅ Frontend container started successfully"
        else
          echo "❌ Frontend container failed to start"
          docker logs myleague-frontend-test
          exit 1
        fi
        
        # Test basic HTTP response
        for i in {1..10}; do
          if curl -f -s http://localhost:5173 >/dev/null 2>&1; then
            echo "✅ Frontend is serving content on attempt $i"
            break
          elif [ $i -eq 10 ]; then
            echo "❌ Frontend not responding after 10 attempts"
            docker logs myleague-frontend-test
            exit 1
          else
            echo "Attempt $i: Frontend not ready yet, waiting 3 seconds..."
            sleep 3
          fi
        done
        
        # Test that it's actually serving HTML content
        RESPONSE=$(curl -s http://localhost:5173 | head -n 5)
        if echo "$RESPONSE" | grep -q "html\|HTML\|<!DOCTYPE"; then
          echo "✅ Frontend is serving HTML content"
        else
          echo "⚠️  Frontend responding but may not be serving HTML"
          echo "Response preview: $RESPONSE"
        fi
        
    - name: Cleanup
      if: always()
      run: |
        docker stop myleague-frontend-test || true
        docker rm myleague-frontend-test || true
        docker rmi myleague-frontend:test || true

  docker-compose-integration:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Test Frontend in Docker Compose
      run: |
        # Start only frontend service from docker-compose
        docker compose up -d frontend
        
        # Wait for service to be ready
        echo "Waiting for frontend service to start..."
        sleep 20
        
        # Check if frontend container is running
        if docker compose ps frontend | grep -q "Up"; then
          echo "✅ Frontend service started successfully"
        else
          echo "❌ Frontend service failed to start"
          docker compose logs frontend
          exit 1
        fi
        
        # Test frontend accessibility
        if curl -f -s http://localhost:5173 >/dev/null; then
          echo "✅ Frontend accessible via docker-compose"
        else
          echo "❌ Frontend not accessible"
          docker compose logs frontend
          docker compose ps
          exit 1
        fi
        
    - name: Cleanup
      if: always()
      run: |
        docker compose down -v
