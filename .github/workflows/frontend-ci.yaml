name: Frontend CI

on:
  push:
    branches: [master, development]
    paths:
      - 'src/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/frontend-ci.yaml'
  pull_request:
    branches: [master, development]
    paths:
      - 'src/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/frontend-ci.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  WORKING_DIRECTORY: 'src/frontend'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.11.0

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'pnpm'
        cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/pnpm-lock.yaml

    - name: Install dependencies
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: pnpm install --frozen-lockfile

    - name: Audit dependencies
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: pnpm audit --audit-level=high
      continue-on-error: true

    - name: Run ESLint
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: pnpm lint

    - name: TypeScript type checking
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: npx tsc --noEmit

    # Tests will be added later. When a "test" script exists in package.json,
    # enable this step (and optionally upload coverage as an artifact).
    # - name: Run unit tests
    #   working-directory: ${{ env.WORKING_DIRECTORY }}
    #   run: pnpm test -- --run

    - name: Build production bundle
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: pnpm build

    - name: Check build artifacts
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        if [ -d "dist" ]; then
          echo "Build artifacts created successfully"
          echo "Build size:"
          du -sh dist/
          ls -la dist/
        else
          echo "Build artifacts not found"
          exit 1
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: ${{ env.WORKING_DIRECTORY }}/dist/
        retention-days: 7

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        docker build -t myleague-frontend:test .

    - name: Test container startup
      run: |
        docker run -d --name myleague-frontend-test -p 5173:5173 myleague-frontend:test

        for i in {1..20}; do
          if curl -f -s http://localhost:5173 >/dev/null 2>&1; then
            echo "Frontend is serving content on attempt $i"
            break
          elif [ $i -eq 20 ]; then
            echo "Frontend not responding after 20 attempts"
            docker logs myleague-frontend-test
            exit 1
          else
            echo "Attempt $i: Frontend not ready yet, waiting 3 seconds..."
            sleep 3
          fi
        done

        RESPONSE=$(curl -s http://localhost:5173 | head -n 5)
        if echo "$RESPONSE" | grep -q "html\|HTML\|<!DOCTYPE"; then
          echo "Frontend is serving HTML content"
        else
          echo "Frontend responding but may not be serving HTML"
          echo "Response preview: $RESPONSE"
        fi

    - name: Cleanup
      if: always()
      run: |
        docker stop myleague-frontend-test || true
        docker rm myleague-frontend-test || true
        docker rmi myleague-frontend:test || true

  docker-compose-integration:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Test Frontend in Docker Compose
      run: |
        docker compose build frontend
        docker compose up -d --no-deps frontend

        for i in {1..20}; do
          if curl -f -s http://localhost:5173 >/dev/null 2>&1; then
            echo "Frontend accessible via docker-compose on attempt $i"
            break
          elif [ $i -eq 20 ]; then
            echo "Frontend not accessible after 20 attempts"
            docker compose logs frontend
            docker compose ps
            exit 1
          else
            echo "Attempt $i: Frontend not ready yet, waiting 3 seconds..."
            sleep 3
          fi
        done

    - name: Cleanup
      if: always()
      run: |
        docker compose down -v
