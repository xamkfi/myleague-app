name: Backend CI

on:
  push:
    branches: [master, development]
    paths:
      - 'src/backend/**'
      - 'tests/backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yaml'
  pull_request:
    branches: [master, development]
    paths:
      - 'src/backend/**'
      - 'tests/backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '9.0.x'
  BUILD_CONFIGURATION: 'Release'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore MyLeague.sln

    - name: Check for vulnerable packages
      run: dotnet list MyLeague.sln package --vulnerable --include-transitive
      continue-on-error: true

    - name: Build solution
      run: dotnet build MyLeague.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

    - name: Run unit tests
      run: dotnet test MyLeague.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger trx --results-directory TestResults

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults/*.trx

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create CI compose override
      run: |
        cat > docker-compose.ci.yml << 'EOF'
        services:
          webapi:
            ports:
              - "8080:8080"
        EOF

    - name: Start backend services
      run: |
        docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build webapi

    - name: Verify API startup
      run: |
        for i in {1..30}; do
          if curl -f -s http://localhost:8080/health >/dev/null 2>&1; then
            echo "✅ API health check passed on attempt $i"
            break
          elif curl -f -s http://localhost:8080 >/dev/null 2>&1; then
            echo "✅ API is responding on attempt $i"
            break
          elif [ $i -eq 30 ]; then
            echo "❌ API not responding after 30 attempts"
            docker compose logs webapi
            docker compose ps
            exit 1
          else
            echo "Attempt $i: API not ready yet, waiting 3 seconds..."
            sleep 3
          fi
        done

    - name: Cleanup
      if: always()
      run: |
        docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  integration-smoke-test:
    name: Integration Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myleague_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore MyLeague.sln

    - name: Build WebAPI
      run: |
        cd src/backend/WebAPI
        dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

    - name: Wait for PostgreSQL to be ready
      run: |
        echo "Waiting for PostgreSQL to be ready..."
        timeout 60s bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 2; done'
        echo "PostgreSQL is ready!"

    - name: Test API startup with database
      run: |
        cd src/backend/WebAPI

        export ConnectionStrings__DefaultConnection="Host=localhost;Database=myleague_test;Username=postgres;Password=postgres"
        export ASPNETCORE_ENVIRONMENT=Development
        export ASPNETCORE_URLS="http://localhost:5000"

        echo "Starting API with database connection..."
        echo "Using URL: $ASPNETCORE_URLS"

        timeout 60s dotnet run --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --no-launch-profile &
        API_PID=$!

        echo "Waiting for API to start..."
        for i in {1..30}; do
          if curl -f -s http://localhost:5000/health >/dev/null 2>&1; then
            echo "✅ API health check passed on attempt $i"
            break
          elif curl -f -s http://localhost:5000 >/dev/null 2>&1; then
            echo "✅ API is responding on attempt $i"
            break
          elif [ $i -eq 30 ]; then
            echo "❌ API failed to respond after 30 attempts"
            if ps -p $API_PID > /dev/null 2>&1; then
              echo "API process is running but not responding"
              netstat -tulpn | grep :5000 || echo "Port 5000 not listening"
            else
              echo "API process has exited"
            fi
            exit 1
          else
            echo "Attempt $i: API not ready yet, waiting 2 seconds..."
            sleep 2
          fi
        done

        echo "✅ Integration smoke test completed successfully"

        kill $API_PID 2>/dev/null || true
        wait $API_PID 2>/dev/null || true
