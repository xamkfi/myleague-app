name: Backend CI

on:
  push:
    branches: [ master, development, jantoi/myl-65-do-ci-for-backend ]
    paths:
      - 'src/backend/**'
      - 'tests/backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yaml'
  pull_request:
    branches: [ master, development, jantoi/myl-65-do-ci-for-backend ]
    paths:
      - 'src/backend/**'
      - 'tests/backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yaml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  BUILD_CONFIGURATION: 'Release'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Restore dependencies
      run: dotnet restore MyLeague.sln
      
    - name: Build solution
      run: dotnet build MyLeague.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
      
    - name: Run unit tests
      run: dotnet test MyLeague.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger trx --results-directory TestResults
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults/*.trx

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: |
        docker build -f src/backend/WebAPI/Dockerfile -t myleague-api:test .
        
    - name: Test container startup
      run: |
        # Start container in background
        docker run -d --name myleague-test -p 8080:8080 \
          -e ASPNETCORE_ENVIRONMENT=Production \
          -e ConnectionStrings__DefaultConnection="Host=localhost;Database=myleague;Username=test;Password=test" \
          myleague-api:test
        
        # Wait a moment for startup
        sleep 10
        
        # Check if container is running
        if docker ps | grep -q myleague-test; then
          echo "✅ Container started successfully"
          docker logs myleague-test
        else
          echo "❌ Container failed to start"
          docker logs myleague-test
          exit 1
        fi
        
    - name: Cleanup
      if: always()
      run: |
        docker stop myleague-test || true
        docker rm myleague-test || true
        docker rmi myleague-api:test || true

  integration-smoke-test:
    name: Integration Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myleague_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Build WebAPI
      run: |
        cd src/backend/WebAPI
        dotnet build --configuration ${{ env.BUILD_CONFIGURATION }}
        
    - name: Test API startup with database
      run: |
        cd src/backend/WebAPI
        
        # Set environment variables for test database
        export ConnectionStrings__DefaultConnection="Host=localhost;Database=myleague_test;Username=postgres;Password=postgres"
        export ASPNETCORE_ENVIRONMENT=Development
        
        # Start the API in background
        timeout 30s dotnet run --configuration ${{ env.BUILD_CONFIGURATION }} --no-build &
        API_PID=$!
        
        # Wait for startup
        sleep 15
        
        # Test if API is responding (basic health check)
        if curl -f http://localhost:5000/health 2>/dev/null || curl -f http://localhost:8080/health 2>/dev/null; then
          echo "✅ API health check passed"
        else
          echo "⚠️  Health check endpoint not found, testing root endpoint"
          if curl -f http://localhost:5000 2>/dev/null || curl -f http://localhost:8080 2>/dev/null; then
            echo "✅ API is responding"
          else
            echo "❌ API is not responding"
            exit 1
          fi
        fi
        
        # Cleanup
        kill $API_PID || true
