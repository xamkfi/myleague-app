services:
  webapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # Database connection
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=myleague;Username=postgres;Password=postgres
      # Serilog configuration for Seq
      - Serilog__WriteTo__2__Name=Seq
      - Serilog__WriteTo__2__Args__serverUrl=http://seq:80
      - Serilog__WriteTo__2__Args__apiKey=
      # Auth - JWT
      - Jwt__SecretKey=DevSuperSecretKeyThatIsAtLeast32Characters!!
      - Jwt__Issuer=MyLeague
      - Jwt__Audience=MyLeague
      # Auth - Seed (default test user)
      - Seed__AdminEmail=test@myleague.fi
      # Auth - ACS (empty = use console in dev)
      - AzureCommunicationServices__ConnectionString=
      - AzureCommunicationServices__SenderAddress=
    ports:
      - "8080:8080"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      # Mount logs directory
      - ./src/backend/WebAPI/logs:/app/logs
      # Local image uploads (writable by non-root APP_UID)
      - ./src/backend/WebAPI/wwwroot/uploads:/app/wwwroot/uploads
    networks:
      - myleague-network